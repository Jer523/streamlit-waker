name: Streamlit Light Wakeup

on:
  schedule:
    # 保持原有的频率：北京时间 12:00, 18:00, 00:00, 06:00
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request
        run: |
          echo "正在访问网站以防止休眠..."
          curl -s --max-redirs 20 -L https://optimaxscan-20.streamlit.app/ > /dev/null || true
          echo "访问完成！"
