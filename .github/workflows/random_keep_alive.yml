name: Streamlit Wakeup (Browser)
on:
  schedule:
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit app
        run: |
          pip install playwright -q
          playwright install chromium-headless-shell --with-deps
          python - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def wake_up():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  print("正在打开页面...")
                  # 先等页面基本加载完（最多2分钟）
                  await page.goto("https://optimaxscan-20.streamlit.app/", timeout=120000)
                  # 等网络请求结束，比等特定元素更稳定
                  await page.wait_for_load_state("networkidle", timeout=120000)
                  print("页面加载成功！")
                  await asyncio.sleep(15)
                  await browser.close()
                  print("唤醒完成！")

          asyncio.run(wake_up())
          EOF
